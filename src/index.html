<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>掃描器</title>
</head>
<body>
    <style>
        html, body {
            width: 100%;
            height: 100%;
        }
        html, body, div {
            padding: 0px;
            margin: 0px;
        }
        #app {
            display: flex;
            flex-direction: column;
        }
        .row {
            display: flex;
        }
        
        .hide {
            display: none;
        }

        canvas {
            max-width: 100%;
            max-height: 100%;
        }
    </style>
    <div id="app"></div>
    <template id="tpl">
        <div class="row">
            <button v-if="!stream" @click="scanByCamera">開啟相機</button>
            <button v-if="!stream" @click="scanImage">開啟圖片</button>
            <button v-if="!stream" @click="scanClipboard">從剪貼簿</button>
            <button v-if="stream" @click="closeCamera">關閉相機</button>
        </div>
        <div v-if="format">
            <p>格式：<span>{{format}}</span></p>
            <p>內文：<span>{{text}}</span></p>
            <!-- <p>位元組資料：<span>{{hex}}</span></p> -->
            <div v-if="pattern">
                <div v-html="svg"></div>
                <button @click="downloadSvg">下載 SVG</button>
                <button @click="downloadPng">下載 PNG</button>
            </div>
        </div>
        <div class="row" v-if="stream">
            <video autoplay playsinline muted style="display: none;"></video>
            <canvas></canvas>
        </div>
        <div>{{errorMsg}}</div>
    </template>
    <script src="./scan.bundle.js"></script>
</body>
</html>
